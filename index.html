<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wolfgang Zimmermann</title>
  <meta name="description" content="Wolfgang Zimmermann – contact">
  <meta name="theme-color" content="#0d0f10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0f10'/%3E%3Ctext x='6' y='23' font-family='monospace' font-size='18' font-weight='bold' fill='%23ff5f56'%3E%3E_%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0d0f10;
      --panel: #15181a;
      --border: #262a2d;
      --text: #d7dadc;
      --muted: #7d858a;
      --accent: #ff5f56;
      --prompt: #8fd18f;
      --mono: ui-monospace, "JetBrains Mono", "Fira Code", "Cascadia Code", Menlo, Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.7 var(--mono);
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .term {
      width: 100%;
      max-width: 560px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
      overflow: hidden;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--border); }
    .dot:first-child { background: var(--accent); }
    .bar span { margin-left: auto; margin-right: auto; padding-right: 47px; }
    .body { padding: 20px 22px 24px; }
    p { margin: 0; overflow-wrap: anywhere; }
    .ps { color: var(--prompt); }
    .ps b { color: var(--accent); font-weight: normal; }
    .out { color: var(--text); margin-bottom: 12px; }
    h1 { font-size: inherit; font-weight: bold; margin: 0 0 12px; }
    a { color: var(--accent); text-decoration: none; border-bottom: 1px dashed currentColor; }
    a:hover, a:focus-visible { border-bottom-style: solid; outline: none; }
    .cursor {
      display: inline-block;
      width: .6em;
      height: 1.1em;
      vertical-align: text-bottom;
      background: var(--text);
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    @media (max-width: 420px) { body { font-size: 13.5px; } .body { padding: 16px; } }
  </style>
</head>
<body>
  <main class="term">
    <div class="bar" aria-hidden="true">
      <i class="dot"></i><i class="dot"></i><i class="dot"></i>
      <span>zimmermann.red</span>
    </div>
    <div class="body">
      <p class="ps"><b>~</b> $ whoami</p>
      <h1 class="out">Wolfgang Zimmermann</h1>
      <p class="ps"><b>~</b> $ contact</p>
      <p class="out"><a href="mailto:wolfgang@zimmermann.red">wolfgang@zimmermann.red</a></p>
      <p class="ps"><b>~</b> $ <span class="cursor" aria-hidden="true"></span></p>
    </div>
  </main>
</body>
</html>
