<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shera &amp; Wolfgang · zimmermann.red</title>
  <meta name="description" content="Shera &amp; Wolfgang – contact">
  <meta name="theme-color" content="#0d0f10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0f10'/%3E%3Ctext x='6' y='23' font-family='monospace' font-size='18' font-weight='bold' fill='%23ff5f56'%3E%3E_%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0d0f10;
      --panel: #15181a;
      --border: #262a2d;
      --text: #d7dadc;
      --muted: #7d858a;
      --accent: #ff5f56;
      --prompt: #8fd18f;
      --mono: ui-monospace, "JetBrains Mono", "Fira Code", "Cascadia Code", Menlo, Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.7 var(--mono);
    }
    .wrap {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .term {
      width: 100%;
      max-width: 680px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
      overflow: hidden;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--border); }
    .dot:first-child { background: var(--accent); }
    .bar span { margin-left: auto; margin-right: auto; padding-right: 47px; }
    .body { padding: 20px 22px 24px; }
    p { margin: 0; overflow-wrap: anywhere; }
    .ps { color: var(--prompt); }
    .ps b { color: var(--accent); font-weight: normal; }
    .out { color: var(--text); margin-bottom: 12px; }
    h1 { font-size: inherit; font-weight: bold; margin: 0 0 12px; }
    .who {
      display: grid;
      grid-template-columns: max-content 1fr;
      column-gap: 2.5ch;
      margin: 0 0 12px;
    }
    .who dt { font-weight: bold; }
    .who dd { margin: 0; min-width: 0; }
    .shot { margin: 4px 0 12px; }
    .shot a { display: block; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; line-height: 0; }
    .shot a:hover, .shot a:focus-visible { border-color: var(--accent); }
    .shot img { display: block; width: 100%; height: auto; }
    .shot figcaption { color: var(--muted); font-size: 12px; margin-top: 6px; }
    a { color: var(--accent); text-decoration: none; border-bottom: 1px dashed currentColor; }
    a:hover, a:focus-visible { border-bottom-style: solid; outline: none; }
    .cursor {
      display: inline-block;
      width: .6em;
      height: 1.1em;
      vertical-align: text-bottom;
      background: var(--text);
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    @media (max-width: 420px) { body { font-size: 13.5px; } .body { padding: 16px; } }
  </style>
</head>
<body>
  <div class="wrap">
  <main class="term">
    <div class="bar" aria-hidden="true">
      <i class="dot"></i><i class="dot"></i><i class="dot"></i>
      <span>zimmermann.red</span>
    </div>
    <div class="body">
      <p class="ps"><b>~</b> $ users</p>
      <h1 class="out">Shera &amp; Wolfgang</h1>
      <p class="ps"><b>~</b> $ cat contacts</p>
      <dl class="who">
        <dt>Shera</dt><dd><a href="mailto:shera@zimmermann.red">shera@zimmermann.red</a></dd>
        <dt>Wolfgang</dt><dd><a href="mailto:wolfgang@zimmermann.red">wolfgang@zimmermann.red</a></dd>
      </dl>
      <p class="ps"><b>~</b> $ open space-selfie.jpg</p>
      <figure class="shot">
        <a href="img/space-selfie-full.jpg">
          <picture>
            <source type="image/webp" srcset="img/space-selfie-800.webp 800w, img/space-selfie-1600.webp 1600w" sizes="(max-width: 680px) 100vw, 640px">
            <img src="img/space-selfie-1600.jpg" srcset="img/space-selfie-800.jpg 800w, img/space-selfie-1600.jpg 1600w" sizes="(max-width: 680px) 100vw, 640px" width="1600" height="1200" loading="lazy" decoding="async" alt="Photo of Shera and Wolfgang shown on a satellite's screen in orbit, with Earth below">
          </picture>
        </a>
        <figcaption>// Shera &amp; Wolfgang, in orbit · 2026-09-29</figcaption>
      </figure>
      <p class="ps"><b>~</b> $ <span class="cursor" aria-hidden="true"></span></p>
    </div>
  </main>
  </div>
</body>
</html>
